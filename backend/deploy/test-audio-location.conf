# Temporary signed WAV-only ASR test route. Backend must bind loopback.
location ~ "^/diting-test-audio/media/([a-f0-9]{64}\.wav)$" {
    limit_except GET { deny all; }
    access_log off;
    error_log /dev/null crit;
    rewrite ^/diting-test-audio/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18775;
    proxy_set_header Host $host;
    proxy_set_header Range $http_range;
    proxy_buffering off;
}
location /diting-test-audio/ { return 404; }
