<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>谛听取数测试</title><style>body{font:14px system-ui;width:310px;padding:12px;color:#334155}input{width:95%;padding:7px}button{margin:10px 5px 0 0;padding:7px}p{line-height:1.6}small{color:#64748b}</style><h3>抖音主播取数测试</h3><label>当前主播昵称<input id="teacher" placeholder="与后台右上角昵称一致"></label><button id="start">开始每10秒取数</button><button id="stop">结束本场采集</button><button id="export">导出 JSON</button><details><summary>OBS 直播源</summary><p><small>在 OBS 正在采集的大屏页面绑定。静音提醒的刷新仅操作该标签页，不触发数据上传。</small></p><button id="bind-source">绑定当前大屏为直播源</button><p id="source-status" role="status"></p></details><details><summary>上传设置</summary><label>接收接口<input id="endpoint" placeholder="https://你的域名/api/metrics/batches"></label><label>上传令牌<input id="token" type="password" autocomplete="off"></label><button id="configure">保存上传设置</button><button id="upload">立即上传</button></details><p id="health" role="status" style="white-space:pre-line;background:#fff4db;padding:10px;border-radius:6px"></p><p id="status" role="status"></p><small>配置上传前仅本机保存；配置后每5分钟上传；连续10分钟无新采样自动补传缓存。浏览器重启后补传；关机期间无法上传。请保持大屏可见。采集批次不等于直播场次；明确停播提示连续确认后自动收尾；空白或断网需人工确认结束。不自动开播。</small><script type="module" src="popup.js"></script></html>
