<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>谛听取数测试</title><style>body{font:14px system-ui;width:310px;padding:12px;color:#334155}input{width:95%;padding:7px}button{margin:10px 5px 0 0;padding:7px}p{line-height:1.6}small{color:#64748b}</style><h3>抖音主播取数测试</h3><label>当前主播昵称<input id="teacher" placeholder="与后台右上角昵称一致"></label><button id="start">开始每10秒取数</button><button id="stop">停止</button><button id="export">导出 JSON</button><details><summary>上传设置</summary><label>接收接口<input id="endpoint" placeholder="https://你的域名/api/metrics/batches"></label><label>上传令牌<input id="token" type="password" autocomplete="off"></label><button id="configure">保存上传设置</button><button id="upload">立即上传</button></details><p id="status" role="status"></p><small>配置上传前仅本机保存；配置后每5分钟上传。请保持大屏可见。采集批次不等于直播场次；尚未自动识别开关播。</small><script type="module" src="popup.js"></script></html>
