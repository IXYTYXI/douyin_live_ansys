<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>「谛听」百应场控数据采集</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #181818; background: #f7f7f5; }
    * { box-sizing: border-box; }
    body { width: 390px; margin: 0; padding: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand img { width: 28px; height: 28px; flex: 0 0 auto; }
    h1 { margin: 0; font-size: 18px; }
    .hint { margin: 0 0 14px; color: #737373; font-size: 12px; line-height: 1.55; }
    button { width: 100%; padding: 11px 14px; border: 0; border-radius: 9px; color: #fff; background: #181818; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:disabled { color: #999; background: #e4e4e1; cursor: wait; }
    #status { min-height: 18px; margin: 11px 0 0; font-size: 12px; line-height: 1.45; }
    #status[data-kind="error"] { color: #b42318; }
    #status[data-kind="success"] { color: #177245; }
    #status[data-kind="loading"] { color: #555; }
    #result { margin-top: 14px; border-top: 1px solid #e5e5e2; }
    #meta { padding: 12px 0 7px; color: #767676; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .metric { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid #ececea; }
    .metric-label { font-size: 12px; font-weight: 600; }
    .metric strong { font-size: 14px; font-variant-numeric: tabular-nums; }
    #copy { margin-top: 12px; color: #333; background: #e9e9e6; }
    .auto-panel { margin: 16px 0; padding: 12px; border: 1px solid #d6d6d2; border-radius: 9px; }
    .auto-panel label { display: block; font-size: 13px; margin: 10px 0; }
    .auto-panel input[type="text"] { display: block; width: 100%; padding: 8px; margin-top: 4px; }
    #auto-status { font-size: 12px; line-height: 1.6; color: #694b00; }
  </style>
</head>
<body>
  <div class="brand"><img src="icons/icon48.png" alt=""><h1>「谛听」百应场控数据采集</h1></div>
  <section class="auto-panel" aria-label="自动采集设置">
    <strong>自动采集 · 联调版</strong>
    <p class="hint">首次由运营手动打开并登录罗盘后台。当前版本先保存设置，实时采集尚未接通。仅使用隔离测试表。</p>
    <label>平台账号 ID<input id="auto-author" type="text" inputmode="numeric" autocomplete="off" maxlength="30" /></label>
    <label>老师姓名<input id="auto-teacher" type="text" maxlength="100" autocomplete="off" /></label>
    <button id="auto-configure" disabled>绑定当前后台并保存设置</button>
    <label><input id="auto-enabled" type="checkbox" disabled /> 全自动采集开关</label>
    <p id="auto-status" role="status" aria-live="polite">正在读取设置…</p>
  </section>
  <p class="hint">请先打开需要采集的直播详情页，再点击下方按钮。页面会自动刷新一次。</p>
  <button id="capture">获取并汇总数据</button>
  <div id="status" aria-live="polite"></div>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
