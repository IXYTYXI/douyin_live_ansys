<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>谛听 · 直播复盘实验室</title><meta name="description" content="直播复盘交互测试：模拟录像、十秒指标、文字稿与总结按时间联动。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23294ee8'/%3E%3Cpath d='M8 20V12m8 13V7m8 13V12' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<main><div class="page-title"><h1>复盘页面</h1><p id="source-note">模拟数据测试 · 视频与文字均为演示</p></div><section class="session-bar"><div><label for="session">当前直播</label><select id="session"><option value="0">林老师 · 分数应用题专项</option><option value="1">周老师 · 阅读理解训练</option></select></div><div class="session-meta" id="session-meta"></div><span class="pill">指标采样 10 秒</span></section>
<div class="time-heading"><h2>按时间查看</h2><span>每 30 分钟一个复盘区间</span></div><nav id="top-tabs" aria-label="直播时间段"></nav>

<div class="workspace"><section class="card playback"><div class="card-head"><h2>视频回放</h2></div><p class="muted" id="video-range"></p><div class="lesson"><button id="play" class="play-button" aria-label="播放模拟录像">▶</button><p id="video-note">模拟录屏回放</p><div hidden><span id="lesson-teacher"></span><span id="lesson-time"></span><span id="lesson-topic"></span><span id="lesson-line"></span></div></div><input id="segment-slider" type="range" min="0" max="2" value="0" step="1" aria-label="播放进度"><p class="position">播放位置 <strong id="play-time"></strong><span id="play-end" hidden></span></p><div class="skip-controls"><button id="back-ten">‹ 后退 10 分钟</button><button id="forward-ten">前进 10 分钟 ›</button></div><details class="play-settings"><summary>播放设置</summary><label>跳转步长 <select id="step"><option value="300">5 分钟</option><option value="600" selected>10 分钟</option><option value="900">15 分钟</option><option value="1800">30 分钟</option></select></label><label>演示速度 <select id="speed"><option value="1" selected>1×</option><option value="60">60×</option><option value="120">120×</option></select></label></details><p class="footnote">选择时间段后，右侧同步查看<br>这段时间的文字、数据和主题。</p><div id="segment-buttons" hidden></div></section>
<div class="right-column"><section class="card transcript-card"><div class="card-head"><h2>同一时段的文字稿</h2><span class="muted" id="transcript-source">模拟文字 · 点击定位</span></div><div id="transcript" class="transcript"></div></section><section class="card chart-card"><div class="card-head"><h2>在线人数曲线</h2><span class="muted" id="chart-range"></span></div><div class="stats"><div><span>有效点均值</span><strong id="average"></strong></div><div><span>采样最大值</span><strong id="maximum"></strong></div><div><span>有效采样</span><strong id="sample-count"></strong></div></div><p id="session-aggregate" class="muted" hidden></p><div id="chart" aria-label="在线人数曲线"></div><div class="chart-footer"><span id="chart-status"></span><span id="hover-readout">点击曲线定位回放</span></div></section>
<section class="card summary-card"><h2>AI总结（可修改）</h2><div class="summary-inline"><label for="theme">授课主题：</label><input id="theme" type="text" maxlength="16" aria-label="授课主题，最多16字" title="点击修改，最多16字"><span id="theme-count" hidden></span></div><div class="summary-inline"><span id="keywords-label">关键词：</span><div id="keywords" class="tag-editor" role="group" aria-labelledby="keywords-label" data-label="关键词"></div></div></section></div></div><section class="card review-card"><div class="card-head"><h2>运营填写</h2><span class="muted" id="draft-status"></span></div><div class="scope-tabs"><button id="scope-range" aria-pressed="true">当前时段</button><button id="scope-session" aria-pressed="false">整场直播</button></div><label for="conclusion">复盘结论</label><textarea id="conclusion" class="editor" rows="3" placeholder="记录内容、互动与人数变化中的观察…"></textarea><label for="adjustment">下一场调整</label><textarea id="adjustment" class="editor" rows="3" placeholder="把观察变成下一次可以尝试的动作…"></textarea><div class="save-row"><span id="save-status" role="status">仅保存在当前浏览器</span><button id="save" class="primary">保存复盘</button></div></section><footer id="page-footer">全部为模拟数据 · 复盘仅保存在当前浏览器</footer></main><div id="toast" role="status"></div><script type="module" src="app.mjs"></script></body></html>
